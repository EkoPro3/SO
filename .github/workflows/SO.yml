name: Decompile .SO Files

on:
  push:
    paths:
      - '**.so'
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب الملفات من المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. تثبيت جافا
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. تحميل وتثبيت أداة Ghidra
    - name: Download and Install Ghidra
      run: |
        wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip -O ghidra.zip
        unzip -q ghidra.zip
        mv ghidra_11.0.3_PUBLIC ghidra
        chmod +x ghidra/support/analyzeHeadless

    # 4. إنشاء سكريبت التفكيك المخصص داخل المجلد الافتراضي لـ Ghidra
    - name: Create Custom Ghidra Decompiler Script
      run: |
        mkdir -p ghidra/Ghidra/Features/Base/ghidra_scripts
        cat << 'EOF' > ghidra/Ghidra/Features/Base/ghidra_scripts/CustomDecompiler.java
        import ghidra.app.script.GhidraScript;
        import ghidra.app.decompiler.DecompInterface;
        import ghidra.app.decompiler.DecompileResults;
        import ghidra.program.model.listing.Function;
        import ghidra.program.model.listing.FunctionIterator;
        import java.io.PrintWriter;
        import java.io.FileWriter;

        public class CustomDecompiler extends GhidraScript {
            @Override
            public void run() throws Exception {
                String[] args = getScriptArgs();
                if (args.length == 0) return;
                String outputFile = args[0];

                DecompInterface decompInterface = new DecompInterface();
                decompInterface.openProgram(currentProgram);

                PrintWriter writer = new PrintWriter(new FileWriter(outputFile));
                writer.println("// Decompiled using Ghidra Headless Analyzer");
                writer.println("// Target: " + currentProgram.getName() + "\n");

                FunctionIterator functions = currentProgram.getListing().getFunctions(true);
                while (functions.hasNext() && !monitor.isCancelled()) {
                    Function f = functions.next();
                    if (f.isThunk()) continue;
                    
                    DecompileResults results = decompInterface.decompileFunction(f, 30, monitor);
                    if (results != null && results.getDecompiledFunction() != null) {
                        writer.println(results.getDecompiledFunction().getC());
                        writer.println("\n// " + "==================================================" + "\n");
                    }
                }
                writer.close();
                decompInterface.dispose();
            }
        }
        EOF

    # 5. تشغيل التفكيك المنظم
    - name: Decompile All .SO Files
      run: |
        mkdir -p App_Source_Code
        
        # تفعيل خاصية عدم الفشل إذا لم يتطابق النمط (في حال لم تكن هناك ملفات .so)
        shopt -s nullglob
        
        for file in *.so; do
          if [ -f "$file" ]; then
            filename=$(basename -- "$file")
            filename_no_ext="${filename%.*}"
            
            echo "========================================="
            echo "Processing and Decompiling: $filename"
            echo "========================================="
            
            mkdir -p "App_Source_Code/$filename_no_ext"
            
            # تشغيل الأداة مع تمرير مسار السكريبت المخصص بدقة عبر سطر الأوامر لضمان التقاطه
            ./ghidra/support/analyzeHeadless . Temporary_Project \
              -import "$file" \
              -scriptPath ./ghidra/Ghidra/Features/Base/ghidra_scripts \
              -postScript CustomDecompiler.java "App_Source_Code/$filename_no_ext/${filename_no_ext}.c" \
              -deleteProject
          fi
        done

    # 6. رفع المخرجات كملف واحد منظم
    - name: Upload Decompiled Source
      uses: actions/upload-artifact@v4
      with:
        name: App-All-Decompiled-Source
        path: App_Source_Code/
